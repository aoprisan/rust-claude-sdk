[package]
name = "rust-claude-sdk"
description = "A small typed client for Anthropic's Messages API: citations, prompt caching, refusal fallbacks, server tools, retries, streaming, batches, files and models."
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aoprisan/rust-claude-sdk"
documentation = "https://docs.rs/rust-claude-sdk"
readme = "README.md"
keywords = ["anthropic", "claude", "llm", "ai", "api"]
categories = ["api-bindings", "asynchronous"]
exclude = [".github/"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
